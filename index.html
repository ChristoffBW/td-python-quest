<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TD Python Quest</title>
<style>
:root{
  --bg:#262626;--card:#333333;--line:#4a4a4a;--text:#d6d6d6;--muted:#8d8d8d;
  --green:#5fc46b;--green-d:#3f8f4a;--blue:#4aa3df;--blue-d:#2f7fb8;
  --red:#e0524d;--red-d:#a83a36;--gold:#e5c13d;--gold-d:#b39a2e;
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background-color:var(--bg);color:var(--text);
  background-image:linear-gradient(#2e2e2e 1px,transparent 1px),linear-gradient(90deg,#2e2e2e 1px,transparent 1px);
  background-size:24px 24px;
  font-family:"Source Sans 3","Source Sans Pro",system-ui,-apple-system,"Segoe UI",sans-serif;font-weight:500;font-size:15px}
button{font:inherit;color:inherit;cursor:pointer}
code{font-family:var(--mono);background:#1a1a1a;color:#e8c07a;padding:1px 6px;border-radius:3px;font-size:.92em}
b{font-weight:700}

/* ---------- buttons ---------- */
.btn{--c:var(--blue);--cd:var(--blue-d);border:1px solid #1a1a1a;border-radius:3px;padding:11px 24px;background:var(--c);
  color:#fff;font-weight:700;text-transform:uppercase;letter-spacing:.08em;font-size:13px;transition:filter .1s}
.btn:hover:not(:disabled){filter:brightness(1.12)}
.btn:active:not(:disabled){filter:brightness(.85)}
.btn.blue{--c:var(--blue)}
.btn.red{--c:var(--red)}
.btn.ghost{background:#3a3a3a;color:var(--text);border-color:#1a1a1a}
.btn:disabled{background:#303030;color:#666;cursor:not-allowed}
.btn.wide{width:100%;max-width:420px}

/* ---------- home / network editor ---------- */
.home{max-width:620px;margin:0 auto;padding:0 16px 80px}
.top{position:sticky;top:0;z-index:5;background:#1b1b1b;display:flex;justify-content:space-between;align-items:center;
  padding:8px 14px;border-bottom:1px solid #000;margin:0 -16px 24px;box-shadow:0 2px 8px rgba(0,0,0,.4)}
.logo{font-weight:700;font-size:15px;letter-spacing:.04em;color:#e8e8e8}
.stats{display:flex;gap:6px}
.chip{background:#2c2c2c;border:1px solid #111;border-radius:3px;padding:3px 10px;font-weight:600;font-size:13px;color:#e5c13d;font-family:var(--mono)}
button.chip{color:var(--text)}
.unit{margin-bottom:44px}
.banner{background:#1d1d1d;border:1px solid #000;border-left:6px solid var(--c);border-radius:3px;padding:12px 16px;box-shadow:0 3px 10px rgba(0,0,0,.35)}
.banner .ucount{font-size:11px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--c);font-family:var(--mono)}
.banner h2{margin:2px 0 4px;font-size:21px;color:#eee}
.banner p{margin:0;color:var(--muted);font-size:14px}
.path{display:flex;flex-direction:column;align-items:center;gap:34px;padding:34px 0 6px}
.nodewrap{display:flex;flex-direction:column;align-items:center;position:relative}
.nodewrap:not(:first-child)::before{content:"";position:absolute;top:-34px;height:34px;width:2px;background:var(--c);opacity:.8}
.node{position:relative;width:230px;height:58px;border-radius:5px;border:1px solid #000;background:var(--c);color:#111;
  display:flex;align-items:center;gap:12px;padding:0 14px;font-weight:700;font-size:16px;text-align:left;
  box-shadow:0 3px 8px rgba(0,0,0,.5), inset 0 1px 0 rgba(255,255,255,.25);transition:transform .08s, filter .1s}
.node:hover:not(.locked){filter:brightness(1.1)}
.node:active:not(.locked){transform:translateY(2px)}
.node .ico{font-size:22px;filter:drop-shadow(0 1px 0 rgba(255,255,255,.25))}
.node .nm{flex:1;line-height:1.15}
/* connector tabs */
.node::before,.node::after{content:"";position:absolute;left:50%;margin-left:-6px;width:12px;height:6px;background:#111;border:1px solid #000}
.node::before{top:-7px;border-radius:3px 3px 0 0;background:var(--c)}
.node::after{bottom:-7px;border-radius:0 0 3px 3px;background:var(--c)}
.node.locked{background:#3c3c3c;color:#777;cursor:not-allowed;box-shadow:0 2px 6px rgba(0,0,0,.4)}
.node.locked::before,.node.locked::after{background:#3c3c3c}
.node.locked .ico{filter:grayscale(1);opacity:.6}
.node.done{box-shadow:0 3px 8px rgba(0,0,0,.5),0 0 0 2px #fff3, inset 0 1px 0 rgba(255,255,255,.25)}
.node.done .tick{position:absolute;right:-8px;top:-8px;width:20px;height:20px;border-radius:50%;background:var(--green);border:2px solid #111;color:#111;font-size:12px;display:grid;place-items:center;font-weight:900}
.node.cur{animation:pulse 1.6s ease-in-out infinite}
@keyframes pulse{50%{box-shadow:0 0 0 4px #ffffff55,0 0 18px var(--c)}}
.nlabel{display:none}
.stars{font-size:11px;margin-top:10px;letter-spacing:3px;height:14px;color:var(--gold)}
.start{position:absolute;top:-34px;right:-10px;background:#fff;color:#111;font-weight:800;border-radius:3px;padding:3px 9px;font-size:11px;
  letter-spacing:.12em;animation:bob 1.2s ease-in-out infinite;pointer-events:none;font-family:var(--mono);z-index:2}
@keyframes bob{50%{transform:translateY(-4px)}}
.foot-links{text-align:center;margin-top:20px}
.foot-links button{background:none;border:0;color:var(--muted);text-decoration:underline;font-size:13px}
.win{background:#1d1d1d;border:1px solid var(--gold);border-radius:3px;padding:18px;text-align:center;margin-bottom:24px}

/* ---------- lesson (parameter-window feel) ---------- */
.lesson{max-width:680px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column;padding:0 16px}
.lt{display:flex;align-items:center;gap:14px;padding:14px 0}
.x{background:#3a3a3a;border:1px solid #111;border-radius:3px;color:var(--muted);font-size:16px;line-height:1;padding:6px 9px}
.bar{flex:1;height:14px;background:#171717;border:1px solid #000;border-radius:2px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--blue);transition:width .35s}
.hearts{font-weight:700;color:var(--green);font-size:15px;min-width:76px;text-align:right;font-family:var(--mono);letter-spacing:1px}
.q{flex:1;padding:6px 0 190px}
.q h1{font-size:22px;line-height:1.3;margin:6px 0 16px;font-weight:700;color:#eee}
.code{background:#111;border:1px solid #000;border-left:3px solid var(--blue);border-radius:3px;padding:14px 16px;font-family:var(--mono);font-size:14.5px;
  white-space:pre-wrap;line-height:1.85;margin-bottom:18px;overflow-x:auto;word-break:break-word;box-shadow:inset 0 0 12px rgba(0,0,0,.6)}
.k{color:#ff79c6}.s{color:#9be26b}.n{color:#ffb86c}.c{color:#6b7f89;font-style:italic}.t{color:#6ec9ff}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{display:flex;align-items:center;gap:14px;text-align:left;background:#333;border:1px solid #1a1a1a;
  border-radius:3px;padding:12px 14px;font-size:16px;font-weight:600}
.opt.mono{font-family:var(--mono);font-size:14.5px}
.opt .num{background:#222;border-radius:2px;min-width:24px;height:24px;display:grid;place-items:center;font-size:12px;color:var(--muted);font-family:var(--mono)}
.opt:hover:not(:disabled){background:#3d3d3d}
.opt.sel{border-color:var(--blue);background:#2b4458;color:#d6ecfa}
.opt.sel .num{background:var(--blue);color:#fff}
.opt.right{border-color:var(--green);background:#233a27;color:#c9efcf}
.opt.wrong{border-color:var(--red);background:#472624;color:#f4c4c2}
.opt:disabled{cursor:default}
.slot{display:inline-block;min-width:70px;min-height:30px;border-bottom:2px dashed #6b7f89;margin:0 3px;padding:0 10px;text-align:center;vertical-align:middle;line-height:28px}
.slot.filled{background:#333;border:1px solid #555;border-radius:3px;cursor:pointer;line-height:26px;font-family:var(--mono)}
.slot.ok{border-color:var(--green);color:#c9efcf}.slot.bad{border-color:var(--red);color:#f4c4c2}
.line{min-height:62px;background:#1b1b1b;border:1px solid #000;border-radius:3px;padding:10px;margin-bottom:22px;display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.bank{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:8px}
.tok{font-family:var(--mono);background:#3a3a3a;border:1px solid #111;border-radius:3px;padding:7px 12px;font-size:14.5px;font-weight:600}
.tok:hover{background:#464646}
.tok.used{color:transparent;background:transparent;border:1px dashed #555;pointer-events:none}
.line .tok.ok{border-color:var(--green)}.line .tok.bad{border-color:var(--red)}
.match{display:grid;grid-template-columns:1fr 1fr;gap:8px 14px}
.col{display:flex;flex-direction:column;gap:8px}
.mt{background:#333;border:1px solid #1a1a1a;border-radius:3px;padding:12px 10px;font-size:14.5px;min-height:54px}
.mt.l{font-family:var(--mono)}
.mt.sel{border-color:var(--blue);background:#2b4458;color:#d6ecfa}
.mt.done{visibility:hidden}
.mt.shake{border-color:var(--red);background:#472624;animation:shake .4s}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.tin{width:100%;background:#111;border:1px solid #000;border-radius:3px;color:var(--text);padding:13px 14px;font-family:var(--mono);font-size:16px;outline:none;box-shadow:inset 0 0 8px rgba(0,0,0,.6)}
.tin:focus{border-color:var(--blue)}
.tin.ok{border-color:var(--green)}.tin.bad{border-color:var(--red)}
.hint{color:var(--muted);font-size:13px;margin-top:10px}

/* footer */
.foot{position:fixed;left:0;right:0;bottom:0;border-top:1px solid #000;background:#1b1b1b;padding:16px 16px 20px;z-index:9;box-shadow:0 -4px 12px rgba(0,0,0,.4)}
.foot .in{max-width:680px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:14px}
.foot.ok{background:#1e3322;border-color:#2f5a37}.foot.bad{background:#3a1f1e;border-color:#6a2f2c}
.fb{flex:1;min-width:0}
.fb .big{font-size:18px;font-weight:700}
.foot.ok .big{color:#8fe39b}.foot.bad .big{color:#ff8f8a}
.fb .why{font-size:14px;margin-top:4px;color:#d6d6d6;line-height:1.4}

/* tip + results */
.tipq{display:flex;flex-direction:column;gap:14px}
.mascot{font-size:56px;text-align:center}
.bubble{background:#2f2f2f;border:1px solid #1a1a1a;border-top:3px solid var(--blue);border-radius:3px;padding:14px 18px;font-size:16.5px;line-height:1.5}
.bubble p{margin:0 0 4px}.bubble .code{margin:12px 0 0}
.center{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:14px;min-height:100vh;padding:20px 20px 120px}
.center h1{font-size:28px;margin:0}
.big-emoji{font-size:76px}
.sumrow{display:flex;gap:10px;margin:8px 0}
.sum{border:1px solid #000;border-radius:3px;min-width:104px;overflow:hidden;background:#1d1d1d}
.sum div:first-child{background:var(--c);color:#111;font-size:11px;font-weight:800;letter-spacing:.12em;padding:4px 0;font-family:var(--mono)}
.sum div:last-child{padding:12px 8px;font-size:21px;font-weight:700;color:var(--c);font-family:var(--mono)}
.bigstars{font-size:40px;letter-spacing:6px}
.confetti{position:fixed;top:-20px;width:8px;height:12px;z-index:50;animation:fall linear forwards;pointer-events:none}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg);opacity:.9}}
.toast{position:fixed;left:50%;bottom:30px;transform:translateX(-50%);background:#1b1b1b;border:1px solid #000;padding:9px 18px;border-radius:3px;z-index:60;font-weight:600}

/* progress screen */
.panel{background:#2f2f2f;border:1px solid #1a1a1a;border-radius:3px;padding:14px 16px;margin-bottom:14px}
.panel h3{margin:0 0 10px;font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-family:var(--mono)}
.tiles{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.tile{background:#1d1d1d;border:1px solid #000;border-radius:3px;padding:10px 12px}
.tile b{display:block;font-size:22px;font-family:var(--mono)}.tile span{color:var(--muted);font-size:12px;letter-spacing:.08em;text-transform:uppercase}
.chart{display:flex;align-items:flex-end;gap:4px;height:90px;border-bottom:1px solid #555}
.chart i{flex:1;background:var(--blue);min-height:2px;border-radius:2px 2px 0 0}
.chart i.z{background:#444}
.chartlbl{display:flex;justify-content:space-between;color:var(--muted);font-size:11px;font-family:var(--mono);margin-top:4px}
.mrow{display:flex;align-items:center;gap:10px;margin:8px 0;font-size:14px}
.mrow .lbl{width:150px;flex:none;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mrow .meter{flex:1}.mrow .val{width:70px;text-align:right;font-family:var(--mono);font-size:12px;color:var(--muted)}
.meter{height:10px;background:#171717;border:1px solid #000;border-radius:2px;overflow:hidden}
.meter i{display:block;height:100%;background:var(--c,var(--blue))}
.prof{display:flex;align-items:center;gap:8px;padding:8px 10px;border:1px solid #1a1a1a;border-radius:3px;margin-bottom:6px;background:#333}
.prof.on{border-color:var(--blue);background:#2b4458}
.prof .nm{flex:1;font-weight:700}.prof small{color:var(--muted);font-family:var(--mono)}
.sm{padding:5px 10px;font-size:11px}
.btnrow{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.review{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 0;border-top:1px solid #1a1a1a}
.review:first-of-type{border-top:0}
.warn{background:#4a3a1a;border:1px solid #7a6020;color:#f0d890;border-radius:3px;padding:10px 12px;margin-bottom:14px;font-size:14px}
.modal textarea,.modal input[type=text]{width:100%;background:#111;border:1px solid #000;border-radius:3px;color:var(--text);padding:10px;font-family:var(--mono);font-size:13px;margin-bottom:12px}
.modal textarea{height:110px;resize:vertical}
/* modal */
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:100;display:grid;place-items:center;padding:20px}
.modal{background:#2b2b2b;border:1px solid #000;border-top:3px solid var(--blue);border-radius:4px;padding:20px 22px;max-width:380px;width:100%;box-shadow:0 12px 40px rgba(0,0,0,.6)}
.modal h3{margin:0 0 8px;font-size:19px}.modal p{margin:0 0 18px;color:var(--muted);line-height:1.45}
.modal .row{display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap}
</style>
</head>
<body>
<div id="app"></div>
<script>
// ==DATA==
/* Exercise helpers. For mc(), the FIRST option is the correct one (options are shuffled at runtime). */
const mc    = (q,opts,why,code,mono)=>({k:'mc',q,opts,why,code,mono});
const fill  = (q,tpl,ans,extra,why)=>({k:'fill',q,tpl,ans,extra,why});
const order = (q,toks,extra,why)=>({k:'order',q,toks,extra,why});
const match = (q,pairs)=>({k:'match',q,pairs});
const typ   = (q,acc,why,code)=>({k:'type',q,acc,why,code});

const UNITS=[
/* ================= UNIT 1 ================= */
{title:"Textport Basics",desc:"Print, variables and strings — your first Python in TD",color:"#9b7fe0",dark:"#7a5fc0",lessons:[
 {title:"Say hello",icon:"👋",tip:[
  {t:"The **Textport** is TouchDesigner's Python console. Open it with `Alt+T` (Windows) or `Option+T` (Mac). Anything you `print()` shows up there."},
  {t:"Lines starting with `#` are comments — Python ignores them.",code:"print('Hello TouchDesigner')\n# this is a comment"}],
  ex:[
  mc("Where does `print()` output show up in TouchDesigner?",["The Textport","The Palette browser","The Timeline","The Parameter window"],"`print()` writes to the Textport (Alt+T / Option+T)."),
  fill("Fill in the function that writes text to the Textport.","___('Hello TouchDesigner')",["print"],["echo","say","log"],"`print()` is Python's built-in way to output text."),
  mc("What will this print?",["5","23","'2 + 3'","Nothing — it's an error"],"Python does the maths first, then prints 5.",`print(2 + 3)`),
  typ("Type the code that prints the word glow.",["print('glow')"],"Text needs quotes: `print('glow')`."),
  mc("Which line is a Python comment?",["# set the seed first","// set the seed first","-- set the seed first","/* set the seed first */"],"Python comments start with `#`.",null,true),
  fill("Complete the comment marker.","___ this line does nothing",["#"],["//","--"],"`#` turns the rest of the line into a comment."),
  mc("Which line writes Ready into TouchDesigner's bottom status bar?",["ui.status = 'Ready'","print.status('Ready')","ui.say('Ready')","status('Ready')"],"`ui.status` shows a short message in the status bar.",null,true)
 ]},
 {title:"Variables",icon:"📦",tip:[
  {t:"A **variable** is a named box for a value. Use `=` to put something in it."},
  {t:"Common types: `int` (4), `float` (2.5), `str` ('text'), `bool` (True/False). Most TouchDesigner parameters are floats.",code:"speed = 2.5\nname = 'noise1'\nactive = True"}],
  ex:[
  mc("What type is `speed` here?",["float","int","str","bool"],"A number with a decimal point is a float.",`speed = 2.5`,true),
  fill("Create a variable called count equal to 10, then print it.","___ = 10\nprint(count)",["count"],["'count'","10","print"],"Variable names have no quotes."),
  order("Build a line that stores 0.5 in a variable called opacity.",["opacity","=","0.5"],["==","'opacity'"],"`name = value` assigns."),
  mc("Which is a valid variable name?",["noise_amp","2noise","noise-amp","noise amp"],"Names can't start with a digit or contain dashes or spaces.",null,true),
  mc("What does this show?",["<class 'str'>","<class 'int'>","<class 'text'>","<class 'color'>"],"Text in quotes is a `str`.",`print(type('red'))`,true),
  match("Match each value to its type.",[["42","int"],["3.14","float"],["'cube'","str"],["True","bool"]]),
  mc("What is printed?",["5","4","1","x"],"x becomes 4, then `x + 1` (5) is stored back into x.",`x = 4\nx = x + 1\nprint(x)`)
 ]},
 {title:"Strings & f-strings",icon:"🧵",tip:[
  {t:"Join strings with `+`, repeat them with `*`, and measure them with `len()`."},
  {t:"**f-strings** drop values straight into text — perfect for debug messages. Put `f` before the quote and variables inside `{ }`.",code:"frame = 120\nprint(f'Frame is {frame}')"}],
  ex:[
  mc("What does this print?",["op: noise1","op: {name}","f'op: noise1'","An error"],"The f-string swaps `{name}` for its value.",`name = 'noise1'\nprint(f'op: {name}')`),
  fill("Add the prefix that makes the value get inserted.","print(___'Frame is {frame}')",["f"],["s","format","$"],"An `f` before the opening quote creates an f-string."),
  mc("What is `'beat' + 'box'`?",["'beatbox'","'beat box'","'beat+box'","An error"],"`+` glues strings together with no space added.",null,true),
  mc("What is `'ab' * 3`?",["'ababab'","'ab3'","6","An error"],"`*` repeats a string.",null,true),
  typ("Store the text visuals in a variable named title.",["title = 'visuals'"],"`title = 'visuals'`"),
  mc("What does `len('noise')` return?",["5","4","'noise'","1"],"`len()` counts characters."),
  mc("Which line prints `Value: 0.5` when `v = 0.5`?",["print(f'Value: {v}')","print('Value: {v}')","print(f'Value: v')","print('Value: ' + v)"],"Only the f-string inserts the number. Adding a str and a float is a TypeError.",null,true)
 ]},
 {title:"Casting & text tools",icon:"🔧",tip:[
  {t:"`int()`, `float()` and `str()` convert between types. `int()` chops decimals — it does **not** round. Use `round(x, places)` for that.",code:"x = int(4.5245)   # 4\ny = float(6)      # 6.0\nz = str(101.65)   # '101.65'\nr = round(5.242375, 2)  # 5.24"},
  {t:"Strings have handy methods, and f-strings accept a **format spec** after a colon.",code:"txt = 'The bus was dark green'\nprint(txt.replace('dark green', 'light blue'))\nprint('TEst'.lower(), 'TEst'.upper())\npi = 3.14159\nprint(f'pi is {pi:.2f}')  # pi is 3.14"}],
  ex:[
  mc("What is `int(4.5245)`?",["4","5","4.5","An error"],"`int()` drops the decimals; it doesn't round."),
  mc("What is `round(5.242375, 2)`?",["5.24","5.2","5.25","5"],"The second argument is the number of decimal places."),
  fill("Convert 6 to a float.","y = ___(6)   # 6.0",["float"],["int","str","num"],"`float(6)` gives `6.0`."),
  mc("What does this print?",["Pi is 3.14","Pi is 3.14159","Pi is {pi:.2f}","Pi is .2f"],"`:.2f` inside the braces formats to two decimal places.",`pi = 3.14159\nprint(f'Pi is {pi:.2f}')`),
  fill("Swap part of a string.","txt = 'The bus was dark green'\nprint(txt.___('dark green', 'light blue'))",["replace"],["swap","sub","change"],"`.replace(old, new)` returns the edited text."),
  mc("What does `'TEst'.lower()` return?",["'test'","'TEST'","'Test'","'TEst'"],"`.upper()`, `.lower()` and `.capitalize()` change the case.",null,true),
  typ("Convert the number 101.65 to text.",["str(101.65)"],"`str(101.65)` gives `'101.65'`.")
 ]}
]},
/* ================= UNIT 2 ================= */
{title:"Reaching Operators",desc:"Grab nodes, set parameters, walk the network",color:"#5fc46b",dark:"#43a050",lessons:[
 {title:"op() — grab a node",icon:"🎯",tip:[
  {t:"`op('name')` returns the operator with that name, searched from the current network. Start with `/` for an absolute path."},

// ==/DATA==

// ---------- helpers ----------
const $=s=>document.querySelector(s);
const app=$('#app');
const escT=s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
const esc=s=>escT(s).replace(/"/g,'&quot;');
const fmt=s=>esc(s).replace(/`([^`]+)`/g,'<code>$1</code>').replace(/\*\*(.+?)\*\*/g,'<b>$1</b>').replace(/\n/g,'<br>');
function hl(code){
  if(code==null) return '';
  return escT(code).replace(
    /(#.*$)|('(?:[^'\\\n]|\\.)*'|"(?:[^"\\\n]|\\.)*")|\b(\d+\.?\d*)\b|\b(def|if|elif|else|for|in|return|import|from|as|while|and|or|not|True|False|None|class|lambda|pass|self)\b|\b(op|ops|me|parent|absTime|tdu|ui|debug|project|app|scriptOp|ownerComp|mod|run|ParMode|noiseTOP|print)\b/gm,
    (m,c,s,n,k,t)=>c?`<span class="c">${c}</span>`:s?`<span class="s">${s}</span>`:n?`<span class="n">${n}</span>`:k?`<span class="k">${k}</span>`:`<span class="t">${t}</span>`);
}
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
const norm=s=>String(s).replace(/\s+/g,'').replace(/"/g,"'");
const sameArr=(a,b)=>a.length===b.length&&a.every((x,i)=>x===b[i]);

// ---------- save ----------
const day=d=>d.toLocaleDateString('en-CA');
const daysAgo=n=>{const d=new Date();d.setDate(d.getDate()-n);return d};
const newProfile=name=>({name,xp:0,streak:0,last:'',done:{},stats:{},log:{},kinds:{},c:0,w:0,created:Date.now()});
let store={v:2,active:'p1',sound:true,profiles:{}},save,canPersist=true;
const validLesson=id=>{const[u,l]=String(id).split('-').map(Number);return!!(UNITS[u]&&UNITS[u].lessons[l])};
function cleanProfiles(){
  const out={};
  for(const id in store.profiles){
    const p=store.profiles[id];if(!p||typeof p!=='object') continue;
    const q=Object.assign(newProfile('Player'),p);
    for(const k of ['done','stats','log','kinds']) if(!q[k]||typeof q[k]!=='object') q[k]={};
    for(const k of Object.keys(q.done)) if(!validLesson(k)) delete q.done[k];
    for(const k of Object.keys(q.stats)) if(!validLesson(k)) delete q.stats[k];
    q.name=String(q.name||'Player').slice(0,24);
    for(const k of ['xp','streak','c','w']) q[k]=+q[k]||0;
    out[id]=q;
  }
  store.profiles=out;
}
function selectProfile(id){store.active=id;save=Object.assign(newProfile(''),store.profiles[id]);store.profiles[id]=save}
function loadStore(){
  try{
    const raw=localStorage.getItem('tdpq2');
    if(raw) Object.assign(store,JSON.parse(raw));
    else{
      const old=localStorage.getItem('tdpq');
      if(old){const o=JSON.parse(old);store.profiles.p1=Object.assign(newProfile('Player 1'),{xp:o.xp||0,streak:o.streak||0,last:o.last||'',done:o.done||{}});store.sound=o.sound!==false}
    }
  }catch(e){canPersist=false}
  if(store.profiles&&typeof store.profiles==='object') cleanProfiles(); else store.profiles={};
  if(!store.profiles||!Object.keys(store.profiles).length){store.profiles={p1:newProfile('Player 1')};store.active='p1'}
  if(!store.profiles[store.active]) store.active=Object.keys(store.profiles)[0];
  selectProfile(store.active);
}
function persist(){try{localStorage.setItem('tdpq2',JSON.stringify(store));canPersist=true}catch(e){canPersist=false}}
function curStreak(){
  const t=day(new Date()),y=day(daysAgo(1));
  return(save.last===t||save.last===y)?save.streak:0;
}
function bumpStreak(){
  const t=day(new Date());
  if(save.last===t) return;
  save.streak=curStreak()+1;save.last=t;
}

// ---------- sound ----------
let actx=null;
function beep(seq){
  if(!store.sound) return;
  try{
    actx=actx||new (window.AudioContext||window.webkitAudioContext)();
    let t=actx.currentTime;
    seq.forEach(([f,d,type])=>{
      const o=actx.createOscillator(),g=actx.createGain();
      o.type=type||'sine';o.frequency.value=f;g.gain.setValueAtTime(.12,t);g.gain.exponentialRampToValueAtTime(.001,t+d);
      o.connect(g);g.connect(actx.destination);o.start(t);o.stop(t+d);t+=d*.8;
    });
  }catch(e){}
}

function startLesson(ui,li,skipTip){

  L={ui,li,lesson,id:ui+'-'+li,queue:lesson.ex.slice(),total:lesson.ex.length,mastered:0,hearts:5,mistakes:0,locked:false};
  skipTip?nextEx():tipScreen();
}
function modal(inner,bind){
  const bg=document.createElement('div');bg.className='modal-bg';
  bg.innerHTML=`<div class="modal" role="dialog" aria-modal="true">${inner}</div>`;
  const close=()=>bg.remove();
  bg.onclick=e=>{if(e.target===bg)close()};
  document.body.appendChild(bg);bind(bg.querySelector('.modal'),close);
}
function ask(title,msg,okLabel,onOk,danger,cancelLabel){
  modal(`<h3>${esc(title)}</h3><p>${esc(msg)}</p><div class="row"><button class="btn ghost" data-x="0">${esc(cancelLabel||'Cancel')}</button><button class="btn ${danger?'red':''}" data-x="1">${esc(okLabel)}</button></div>`,(m,close)=>{
    m.querySelector('[data-x="0"]').onclick=close;m.querySelector('[data-x="1"]').onclick=()=>{close();onOk()};m.querySelector('[data-x="0"]').focus()});
}
function askText(title,initial,okLabel,cb){
  modal(`<h3>${esc(title)}</h3><input type="text" maxlength="24" value="${esc(initial)}"><div class="row"><button class="btn ghost" data-x="0">Cancel</button><button class="btn" data-x="1">${esc(okLabel)}</button></div>`,(m,close)=>{
    const i=m.querySelector('input'),go=()=>{const v=i.value.trim();if(!v) return;close();cb(v)};
    m.querySelector('[data-x="0"]').onclick=close;m.querySelector('[data-x="1"]').onclick=go;
    i.onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();go()}};i.focus();i.select()});
}
function quit(){ask('Quit this lesson?','Your progress in this lesson will be lost.','Quit',home,true,'Keep going')}

function tipScreen(){
  const tips=L.lesson.tip.map(p=>`<div class="bubble"><p>${fmt(p.t)}</p>${p.code?`<div class="code">${hl(p.code)}</div>`:''}</div>`).join('');
  app.innerHTML=`<div class="lesson"><div class="lt"><button class="x" id="quit">✕</button><b style="flex:1">${esc(L.lesson.title)}</b></div>
    <main class="q tipq"><div class="mascot">🐍</div>${tips}</main>
    <footer class="foot"><div class="in" style="justify-content:center"><button class="btn wide" id="go">Let's go</button></div></footer></div>`;
  $('#quit').onclick=quit;$('#go').onclick=nextEx;window.scrollTo(0,0);
}

function prep(e){
  const s={};
  if(e.k==='mc'){s.opts=shuffle(e.opts);s.sel=null}
  else if(e.k==='fill'||e.k==='order'){
    const all=e.k==='fill'?[...e.ans,...e.extra]:[...e.toks,...e.extra];
    s.bank=shuffle(all).map(t=>({t,used:false}));
    s.placed=e.k==='fill'?Array(e.tpl.split('___').length-1).fill(null):[];
  }
  else if(e.k==='match'){
    const idx=e.pairs.map((_,i)=>i);
    s.left=shuffle(idx);s.right=shuffle(idx);s.matched=new Set();s.sel=null;s.bad=null;
  }
  else s.val='';
  return s;
}

function nextEx(){
  if(!L.queue.length) return finish();
  L.e=L.queue[0];L.s=prep(L.e);L.locked=false;L.fb=null;
  app.innerHTML=`<div class="lesson"><div class="lt"><button class="x" id="quit">✕</button>
    <div class="bar"><i id="prog" style="width:${L.mastered/L.total*100}%"></i></div><div class="hearts" id="hearts"></div></div>
    <main class="q" id="q"></main><div id="foot"></div></div>`;
  $('#quit').onclick=quit;
  updateHearts();renderQ();renderFooter();window.scrollTo(0,0);
}
const updateHearts=()=>{const h=$('#hearts');h.textContent='■'.repeat(Math.max(0,L.hearts))+'□'.repeat(Math.max(0,5-L.hearts));h.title=L.hearts+' lives left';h.style.color=L.hearts<=2?'var(--red)':'var(--green)'};
const updateProg=()=>{$('#prog').style.width=(L.mastered/L.total*100)+'%'};

function canCheck(){
  const s=L.s,e=L.e;
  if(L.locked) return false;
  if(e.k==='mc') return s.sel!=null;
  if(e.k==='fill') return s.placed.every(x=>x!=null);
  if(e.k==='order') return s.placed.length>0;
  if(e.k==='type') return s.val.trim()!=='';
  return false;
}

function renderQ(){
  const e=L.e,s=L.s,locked=L.locked,fb=L.fb;
  let h=`<h1>${fmt(e.q)}</h1>`;
  if(e.code) h+=`<div class="code">${hl(e.code)}</div>`;
  if(e.k==='mc'){
    h+=`<div class="opts">`+s.opts.map((o,i)=>{
      let c='opt'+(e.mono?' mono':'');
      if(locked){ if(o===e.opts[0]) c+=' right'; else if(s.sel===i) c+=' wrong'; }
      else if(s.sel===i) c+=' sel';
      return `<button class="${c}" data-i="${i}" ${locked?'disabled':''}><span class="num">${i+1}</span><span>${e.mono?hl(o):fmt(o)}</span></button>`;
    }).join('')+`</div>`;
  }
  else if(e.k==='fill'||e.k==='order'){
    const state=locked?(fb.ok?' ok':' bad'):'';
    if(e.k==='fill'){
      const segs=e.tpl.split('___');let code='';
      segs.forEach((sg,i)=>{
        code+=hl(sg);
        if(i<segs.length-1){const p=s.placed[i];
          code+=p==null?`<span class="slot" data-s="${i}"></span>`:`<span class="slot filled${state}" data-s="${i}">${esc(s.bank[p].t)}</span>`;}
      });
      h+=`<div class="code">${code}</div>`;
    } else {
      h+=`<div class="line">`+s.placed.map((bi,k)=>`<button class="tok${state}" data-p="${k}">${esc(s.bank[bi].t)}</button>`).join('')+`</div>`;
    }
    h+=`<div class="bank">`+s.bank.map((b,i)=>`<button class="tok ${b.used?'used':''}" data-b="${i}">${esc(b.t)}</button>`).join('')+`</div>`;
  }
  else if(e.k==='match'){
    const P=e.pairs;
    h+=`<div class="match"><div class="col">`+s.left.map(i=>`<button class="mt l ${s.matched.has(i)?'done':''} ${s.sel===i?'sel':''} ${s.bad&&s.bad.l===i?'shake':''}" data-l="${i}">${esc(P[i][0])}</button>`).join('')
      +`</div><div class="col">`+s.right.map(i=>`<button class="mt ${s.matched.has(i)?'done':''} ${s.bad&&s.bad.r===i?'shake':''}" data-r="${i}">${esc(P[i][1])}</button>`).join('')+`</div></div>`;
  }
  else if(e.k==='type'){
    h+=`<input id="ans" class="tin ${locked?(fb.ok?'ok':'bad'):''}" value="${esc(s.val)}" ${locked?'disabled':''} autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="Type the code…">
        <div class="hint">Spacing and quote style don't matter.</div>`;
  }
  $('#q').innerHTML=h;bindQ();
}

function bindQ(){
  const e=L.e,s=L.s,q=$('#q'),redo=()=>{renderQ();renderFooter()};
  if(L.locked&&e.k!=='match') return;
  if(e.k==='mc') q.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{s.sel=+b.dataset.i;redo()});
  else if(e.k==='fill'||e.k==='order'){
    q.querySelectorAll('[data-b]').forEach(b=>b.onclick=()=>{
      const i=+b.dataset.b;if(s.bank[i].used) return;
      if(e.k==='fill'){const k=s.placed.indexOf(null);if(k<0) return;s.placed[k]=i}else s.placed.push(i);
      s.bank[i].used=true;redo();
    });
    q.querySelectorAll('[data-s]').forEach(b=>b.onclick=()=>{
      const k=+b.dataset.s;if(s.placed[k]==null) return;s.bank[s.placed[k]].used=false;s.placed[k]=null;redo();
    });
    q.querySelectorAll('[data-p]').forEach(b=>b.onclick=()=>{
      const k=+b.dataset.p;s.bank[s.placed[k]].used=false;s.placed.splice(k,1);redo();
    });
  }
  else if(e.k==='match'){
    if(L.locked) return;
    q.querySelectorAll('[data-l]').forEach(b=>b.onclick=()=>{s.sel=+b.dataset.l;renderQ()});
    q.querySelectorAll('[data-r]').forEach(b=>b.onclick=()=>{
      if(s.sel==null||L.hearts<=0) return;
      const r=+b.dataset.r,l=s.sel;
      if(r===l){
        s.matched.add(l);s.sel=null;
        if(s.matched.size===e.pairs.length){renderQ();resolve(true,'')} else {sOk();renderQ()}
      } else {
        s.bad={l,r};s.sel=null;L.hearts--;L.mistakes++;tally('match',false);updateHearts();sBad();renderQ();
        const cur=e;
        setTimeout(()=>{if(L&&L.e===cur&&L.s===s){s.bad=null;if(L.locked) return;if(L.hearts<=0) failed(); else renderQ()}},450);
      }
    });
  }
  else if(e.k==='type'){
    const inp=$('#ans');inp.focus();
    inp.oninput=()=>{s.val=inp.value;const c=$('#check');if(c) c.disabled=!canCheck()};
  }
}

function answerText(e){
  if(e.k==='mc') return e.opts[0];
  if(e.k==='fill'){const sg=e.tpl.split('___');return sg.map((x,i)=>x+(i<e.ans.length?e.ans[i]:'')).join('')}
  if(e.k==='order') return e.toks.join(' ');
  if(e.k==='type') return e.acc[0];
  return '';
}

function renderFooter(){
  const f=$('#foot'),e=L.e,fb=L.fb;
  if(!L.locked){
    f.innerHTML=`<footer class="foot"><div class="in">${e.k==='match'?'<span></span>':'<button class="btn ghost" id="skip">Skip</button>'}
      ${e.k==='match'?'':`<button class="btn" id="check" ${canCheck()?'':'disabled'}>Check</button>`}</div></footer>`;
    const c=$('#check');if(c) c.onclick=check;
    const sk=$('#skip');if(sk) sk.onclick=()=>resolve(false);
    return;
  }
  const praise=['Nice!','Great job!','Correct!','Awesome!','Nailed it!','Smooth!'];
  const why=e.why?`<div class="why">${fmt(e.why)}</div>`:'';
  const ans=!fb.ok&&e.k!=='match'?`<div class="why">Correct answer: <code>${esc(answerText(e))}</code></div>`:'';
  f.innerHTML=`<footer class="foot ${fb.ok?'ok':'bad'}"><div class="in"><div class="fb">
    <div class="big">${fb.ok?'✅ '+praise[Math.floor(Math.random()*praise.length)]:'❌ Not quite'}</div>${ans}${why}</div>
    <button class="btn ${fb.ok?'':'red'}" id="next">Continue</button></div></footer>`;
  $('#next').onclick=()=>{L.hearts<=0?failed():nextEx()};
}

function check(){
  const e=L.e,s=L.s;let ok=false;
  if(e.k==='mc') ok=s.opts[s.sel]===e.opts[0];
  else if(e.k==='fill') ok=s.placed.every((bi,i)=>s.bank[bi].t===e.ans[i]);
  else if(e.k==='order') ok=sameArr(s.placed.map(bi=>s.bank[bi].t),e.toks);
  else if(e.k==='type') ok=e.acc.some(a=>norm(a)===norm(s.val));
  resolve(ok);
}

function tally(k,ok){const K=save.kinds[k]=save.kinds[k]||{c:0,w:0};if(ok){K.c++;save.c++}else{K.w++;save.w++};persist()}
function resolve(ok){
  if(L.locked&&L.fb) return;
  const e=L.e;
  L.locked=true;L.fb={ok};
  tally(e.k,ok);
  if(ok){sOk();L.queue.shift();L.mastered++;updateProg()}
  else{
    sBad();L.hearts--;L.mistakes++;updateHearts();
    L.queue.shift();if(e.k!=='match') L.queue.push(e);else L.mastered++, updateProg();
  }
  renderQ();renderFooter();
}

function failed(){
  app.innerHTML=`<div class="center"><div class="big-emoji">💔</div><h1>Out of hearts</h1>
    <p style="color:var(--muted);max-width:360px">Debugging is part of the job. Review the tip and give it another go — you've got this.</p>
    <div style="display:flex;gap:12px;flex-wrap:wrap;justify-content:center"><button class="btn blue" id="retry">Try again</button><button class="btn ghost" id="back">Back to path</button></div></div>`;
  $('#retry').onclick=()=>startLesson(L.ui,L.li);$('#back').onclick=home;
}

function finish(){
  const stars=L.mistakes===0?3:L.mistakes<=2?2:1;
  const acc=Math.max(0,Math.round((L.total/(L.total+L.mistakes))*100));
  const gain=10+(L.total-Math.min(L.total,L.mistakes))*2;
  const firstTime=!save.done[L.id];
  save.xp+=gain;save.done[L.id]=Math.max(save.done[L.id]||0,stars);bumpStreak();
  const st=save.stats[L.id]=save.stats[L.id]||{attempts:0,best:0};st.attempts++;st.best=Math.max(st.best,acc);st.last=Date.now();st.lastMistakes=L.mistakes;
  const today=day(new Date());save.log[today]=(save.log[today]||0)+gain;persist();sWin();
  const ui=L.ui,li=L.li,u=UNITS[ui];
  const nextIdx=li+1<u.lessons.length?[ui,li+1]:ui+1<UNITS.length?[ui+1,0]:null;
  app.innerHTML=`<div class="center"><div class="big-emoji">🏆</div><h1>Lesson complete!</h1><div style="color:var(--muted)">${esc(L.lesson.title)}</div>
    <div class="bigstars">${'⭐'.repeat(stars)}${'☆'.repeat(3-stars)}</div>
    <div class="sumrow"><div class="sum" style="--c:var(--gold)"><div>TOTAL XP</div><div>⚡ ${gain}</div></div>
    <div class="sum" style="--c:var(--green)"><div>ACCURACY</div><div>🎯 ${acc}%</div></div>
    <div class="sum" style="--c:var(--blue)"><div>STREAK</div><div>🔥 ${curStreak()}</div></div></div>
    <div style="display:flex;gap:12px;flex-wrap:wrap;justify-content:center;margin-top:10px">
    ${nextIdx&&firstTime?`<button class="btn blue" id="nextl">Next lesson</button>`:''}<button class="btn ${nextIdx&&firstTime?'ghost':''}" id="back">Back to path</button></div></div>`;
  $('#back').onclick=home;
  const n=$('#nextl');if(n) n.onclick=()=>startLesson(nextIdx[0],nextIdx[1]);
  confetti();
}

function confetti(){
  const cols=['#58cc02','#1cb0f6','#ffc800','#ff4b4b','#ce82ff','#ff9600'];

function progressScreen(){

  if(!canPersist) h+=`<div class="warn">⚠️ This browser can't save progress (private mode?). Use <b>Download backup</b> below to keep it.</div>`;
  h+=`<div class="panel"><h3>${esc(save.name)} — overview</h3><div class="tiles">
    <div class="tile"><b>${doneL}/${totalL}</b><span>Lessons done</span></div><div class="tile"><b>${stars}/${totalL*3}</b><span>Stars</span></div>
    <div class="tile"><b>${ans?acc+'%':'—'}</b><span>Answer accuracy</span></div><div class="tile"><b>${ans}</b><span>Answers given</span></div></div></div>`;
  h+=`<div class="panel"><h3>XP — last 14 days</h3><div class="chart">${xps.map((v,i)=>`<i class="${v?'':'z'}" style="height:${Math.max(2,v/mx*100)}%" title="${days[i][0]}: ${v} XP"></i>`).join('')}</div>
    <div class="chartlbl"><span>${days[0][0].slice(5)}</span><span>today</span></div></div>`;
  h+=`<div class="panel"><h3>Units</h3>`+UNITS.map((u,ui)=>{
    const d=u.lessons.filter((_,li)=>save.done[ui+'-'+li]).length;
    return `<div class="mrow" style="--c:${u.color}"><div class="lbl">${ui+1}. ${esc(u.title)}</div><div class="meter"><i style="width:${d/u.lessons.length*100}%"></i></div><div class="val">${d}/${u.lessons.length}</div></div>`}).join('')+`</div>`;
  const kinds=Object.keys(KIND_NAMES).filter(k=>save.kinds[k]);
  h+=`<div class="panel"><h3>Accuracy by exercise type</h3>`+(kinds.length?kinds.map(k=>{const K=save.kinds[k],t=K.c+K.w,a=Math.round(K.c/t*100);
    return `<div class="mrow" style="--c:${a>=80?'var(--green)':a>=60?'var(--gold)':'var(--red)'}"><div class="lbl">${KIND_NAMES[k]}</div><div class="meter"><i style="width:${a}%"></i></div><div class="val">${a}% · ${t}</div></div>`}).join(''):`<div style="color:var(--muted)">Complete a lesson to see this.</div>`)+`</div>`;
  const weak=Object.keys(save.done).filter(id=>save.done[id]<3||((save.stats[id]||{}).best||100)<80)
    .sort((a,b)=>(save.done[a]-save.done[b])||(((save.stats[a]||{}).best||100)-((save.stats[b]||{}).best||100))).slice(0,5);
  h+=`<div class="panel"><h3>Review suggestions</h3>`+(weak.length?weak.map(id=>`<div class="review"><div><b>${esc(lessonName(id))}</b><div style="color:var(--muted);font-size:12px">${'★'.repeat(save.done[id])}${'☆'.repeat(3-save.done[id])} · best ${(save.stats[id]||{}).best||'—'}% · ${(save.stats[id]||{}).attempts||1} attempt(s)</div></div><button class="btn sm" data-rev="${esc(id)}">Practice</button></div>`).join(''):`<div style="color:var(--muted)">${doneL?'Everything you\'ve finished is at three stars. 🎉':'Finish a lesson and weak spots will show up here.'}</div>`)+`</div>`;
  h+=`<div class="panel"><h3>Profiles</h3>`+Object.keys(store.profiles).map(id=>{const p=store.profiles[id];
    return `<div class="prof ${id===store.active?'on':''}"><div class="nm">${esc(p.name)}</div><small>⚡${p.xp} · ${Object.keys(p.done).length}/${totalL}</small>
    ${id===store.active?`<button class="btn ghost sm" data-ren="${esc(id)}">Rename</button>`:`<button class="btn sm" data-sw="${esc(id)}">Switch</button>`}
    ${Object.keys(store.profiles).length>1?`<button class="btn ghost sm" data-del="${esc(id)}" aria-label="Delete profile">✕</button>`:''}</div>`}).join('')
    +`<div class="btnrow"><button class="btn ghost sm" id="addprof">+ New profile</button></div></div>`;
  h+=`<div class="panel"><h3>Backup &amp; restore</h3><p style="margin:0;color:var(--muted);font-size:14px;line-height:1.5">Progress saves automatically in this browser. Download a backup to move it to another device or keep it safe.</p>
    <div class="btnrow"><button class="btn sm" id="dl">Download backup</button><button class="btn ghost sm" id="code">Show save code</button><button class="btn ghost sm" id="imp">Import…</button><button class="btn red sm" id="rst">Reset this profile</button></div></div></div>`;
  app.innerHTML=h;window.scrollTo(0,0);
  $('#pback').onclick=home;$('#dl').onclick=dlBackup;$('#code').onclick=showCode;$('#imp').onclick=importModal;
  $('#rst').onclick=()=>ask('Reset '+save.name+'?','This clears XP, streak and lesson progress for this profile.','Reset',()=>{const n=save.name;store.profiles[store.active]=newProfile(n);selectProfile(store.active);persist();progressScreen()},true);
  $('#addprof').onclick=()=>askText('New profile','Player '+(Object.keys(store.profiles).length+1),'Create',n=>{const id='p'+Date.now().toString(36);store.profiles[id]=newProfile(n);selectProfile(id);persist();progressScreen()});
  app.querySelectorAll('[data-ren]').forEach(b=>b.onclick=()=>askText('Rename profile',save.name,'Save',n=>{save.name=n;persist();progressScreen()}));
  app.querySelectorAll('[data-sw]').forEach(b=>b.onclick=()=>{selectProfile(b.dataset.sw);persist();progressScreen()});
  app.querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>{const id=b.dataset.del,p=store.profiles[id];
    ask('Delete '+p.name+'?','This permanently removes that profile and its progress.','Delete',()=>{delete store.profiles[id];if(store.active===id) selectProfile(Object.keys(store.profiles)[0]);persist();progressScreen()},true)});
  app.querySelectorAll('[data-rev]').forEach(b=>b.onclick=()=>{const[u,l]=b.dataset.rev.split('-').map(Number);startLesson(u,l)});
}

// ---------- keyboard ----------
document.addEventListener('keydown',ev=>{
  if(ev.key==='Escape'){const m=document.querySelector('.modal-bg');if(m){m.remove();return}const q=$('#quit')||$('#pback');if(q)q.click();return}
  if(document.querySelector('.modal-bg')) return;
  if(ev.key==='Enter'){
    const f=document.activeElement;if(f&&f.tagName==='BUTTON'&&!f.disabled) return;
    const b=$('#next')||$('#check')||$('#go')||$('#nextl')||$('#retry');
    if(b&&!b.disabled){ev.preventDefault();b.click()}
  } else if(L&&L.e&&L.s&&L.e.k==='mc'&&!L.locked&&/^[1-9]$/.test(ev.key)&&document.activeElement.tagName!=='INPUT'){
    const i=+ev.key-1;if(i<L.s.opts.length){L.s.sel=i;renderQ();renderFooter()}
  }
});

loadStore();home();
</script>
</body>
</html>
